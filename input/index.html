<!DOCTYPE html>
<html>
<body>
<h2>Form Input Data Penduduk</h2>

<form action="input.php" onsubmit="return validateForm()" method="post">
    <label for="kecamatan">Kecamatan:</label><br>
    <input type="text" id="kec" name="kecamatan" required><br><br>

    <label for="longitude">Longitude:</label><br>
    <input type="text" id="long" name="longitude" required><br><br>

    <label for="latitude">Latitude:</label><br>
    <input type="text" id="lat" name="latitude" required><br><br>

    <label for="luas">Luas:</label><br>
    <input type="text" id="luas" name="luas" required><br><br>

    <label for="jumlah_penduduk">Jumlah Penduduk:</label><br>
    <input type="text" id="jml_ppdk" name="jumlah_penduduk" required><br><br>

    <input type="submit" value="Submit">
</form>

<p id="informasi" style="color:red;"></p>

<script>
function validateForm() {
    let luas = document.getElementById("luas").value;
    let text = "";
    if (isNaN(luas) || luas < 1) {
        text = "Data luas harus berupa angka dan tidak boleh bernilai negatif atau 0!";
        document.getElementById("informasi").innerHTML = text;
        return false;
    }
    return true;
}
</script>

</body>
</html>
